schema: tome-lang/1
kind: target
lang: zh-TW
name: 繁體中文（台灣）

# 譯後自動排版的規則，在還原佔位符之前執行，不花 token（ADR-0081）。
punctuation:
  replace:
    ",": "，"
    ";": "；"
    ":": "："
    "?": "？"
    "!": "！"
    "(": "（"
    ")": "）"
    "...": "……"
  quotes:
    open: "「"
    close: "」"
    inner_open: "『"
    inner_close: "』"
  space_around_latin: false

pronouns: [他, 她, 牠, 它, 祂]

# 長度過短算疑似摘要，會重送；過長只報告（白皮書 §5.6）。數字是提案，要等試翻量過。
min_length_ratio: 0.3
max_length_ratio: 1.5

# 混入簡體字的判定，算到就重送，所以誤判的代價是白花費用（ADR-0102）。
# 標準 Big5 收的是繁體用字，大多數簡體字形不在裡面，不用維護完整字表。
# 這份語言資料刻意收錄簡體字，測試工具與核心共用，不留第二份。
script_check:
  encoding: big5
  # 0xC7、0xC8 是保留區，不是標準 Big5。
  lead_ranges: [[164, 198], [201, 249]]
  trail_ranges: [[64, 126], [161, 254]]
  # Big5 也收錄的簡體字形。台、准、划、岩、症 這類在繁體也常用的字不列。
  # 取自 Windows 的繁簡對照，再加上對照表不轉換的幾個字。
  shared_forms: 儿几扑虫听坏厂万与气宁优价异忏机网体吨怀扰岭怜构极泞肮虮复洁种胜苹党茧蚕赶适惊据痒离确腊触蜡篱后于并云叶
  # 這些詞在繁體也這樣寫。比對的是字串，所以含這些字串的錯字會漏掉，例如魔后、神后、妖后
  # 也蓋得住「入魔」「回神」接上錯字的寫法。天后與封后的常見錯字列在 misused_words（ADR-0102）。
  allowed_words:
    - 皇后
    - 王后
    - 太后
    - 天后
    - 母后
    - 帝后
    - 后土
    - 后妃
    - 后冠
    - 后稷
    - 后里
    - 后壁
    - 后龍
    - 影后
    - 歌后
    - 封后
    - 廢后
    - 蟻后
    - 蜂后
    - 冥后
    - 神后
    - 魔后
    - 妖后
    - 拮据
    - 茶几
    - 几案
    - 窗明几淨
    - 云云
    - 云爾
    - 人云亦云
    - 不知所云
    - 古人云
    - 詩云
    - 單于
    - 于闐
    - 党項
    - 并州
    - 万俟
    - 叶韻
  # 准 本身是繁體用字，這些詞才是誤用。下面幾行比對的是原文，不受 allowed_words 影響：
  # 數字接上天後、封存接上之後的錯字，看起來跟天后、封后一樣，是最常見的混入寫法。
  misused_words:
    - 標准
    - 水准
    - 基准
    - 准備
    - 准確
    - 一天后
    - 二天后
    - 兩天后
    - 三天后
    - 四天后
    - 五天后
    - 六天后
    - 七天后
    - 八天后
    - 九天后
    - 十天后
    - 百天后
    - 千天后
    - 幾天后
    - 數天后
    - 多天后
    - 半天后
    - 今天后
    - 明天后
    - 當天后
    - 隔天后
    - 前天后
    - 昨天后
    - 拆封后
    - 密封后
    - 解封后
    - 查封后

# OpenCC 只用在只報告的用語檢查，不用來判定簡體字（ADR-0102）。
opencc:
  from: tw
  to: twp

# 會進入提示，靜態前綴要位元組一致。維護者在 2026-11-02 逐字審過（ADR-0103）。
style_guide:
  - 用台灣慣用的繁體中文，不用中國大陸用語。
  - 規則文字同詞同譯，敘事與朗讀文字可以放開一點。
  - 數字、骰子與單位都照原文，不換算。
  - 阿拉伯數字一律保留，不改寫成中文數字：1st 譯成第1，3 times 譯成3次。
  - 英文寫成文字的數字照常翻譯：three times 譯成三次。
  - 代名詞依實體卡，沒有實體卡時依上下文判斷。
  - 使用全形標點，引號用「」，引號內的引號用『』。
  - 中文與英文、數字之間不加空格。

# 用語檢查表，只列報告不重送（ADR-0060）。這裡放 OpenCC 片語表以外的自訂清單。
term_checks: []
# 片語表與自訂清單的誤報。
term_exceptions: []
