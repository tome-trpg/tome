schema: tome-lang/1
kind: target
lang: zh-TW
name: 繁體中文（台灣）

# 譯後自動排版的規則，在還原佔位符之前執行，不花 token（ADR-0081）。
punctuation:
  replace:
    ",": "，"
    ";": "；"
    ":": "："
    "?": "？"
    "!": "！"
    "(": "（"
    ")": "）"
    "...": "……"
  quotes:
    open: "「"
    close: "」"
    inner_open: "『"
    inner_close: "』"
  space_around_latin: false

pronouns: [他, 她, 牠, 它, 祂]

# 長度過短算疑似摘要，會重送；過長只報告（白皮書 §5.6）。下限 0.2 來自第一次真實翻譯：
# 自然的譯文有低於 0.3 的，少一半的摘要約 0.19。只有一本書、一個模型的數據（ADR-0111）。
min_length_ratio: 0.2
max_length_ratio: 1.5

# 混入簡體字的判定，算到就重送，所以誤判的代價是白花費用（ADR-0102）。
# 標準 Big5 收的是繁體用字，大多數簡體字形不在裡面，不用維護完整字表。
# 這份語言資料刻意收錄簡體字，測試工具與核心共用，不留第二份。
script_check:
  encoding: big5
  # 0xC7、0xC8 是保留區，不是標準 Big5。
  lead_ranges: [[164, 198], [201, 249]]
  trail_ranges: [[64, 126], [161, 254]]
  # Big5 也收錄的簡體字形。台、准、划、岩、症 這類在繁體也常用的字不列。
  # 取自 Windows 的繁簡對照，再加上對照表不轉換的幾個字。
  shared_forms: 儿几扑虫听坏厂万与气宁优价异忏机网体吨怀扰岭怜构极泞肮虮复洁种胜苹党茧蚕赶适惊据痒离确腊触蜡篱后于并云叶
  # 這些詞在繁體也這樣寫。比對的是字串，所以含這些字串的錯字會漏掉，例如魔后、神后、妖后
  # 也蓋得住「入魔」「回神」接上錯字的寫法。天后與封后的常見錯字列在 misused_words（ADR-0102）。
  allowed_words:
    - 皇后
    - 王后
    - 太后
    - 天后
    - 母后
    - 帝后
    - 后土
    - 后妃
    - 后冠
    - 后稷
    - 后里
    - 后壁
    - 后龍
    - 影后
    - 歌后
    - 封后
    - 廢后
    - 蟻后
    - 蜂后
    - 冥后
    - 神后
    - 魔后
    - 妖后
    - 拮据
    - 茶几
    - 几案
    - 窗明几淨
    - 云云
    - 云爾
    - 人云亦云
    - 不知所云
    - 古人云
    - 詩云
    - 單于
    - 于闐
    - 党項
    - 并州
    - 万俟
    - 叶韻
  # 准 本身是繁體用字，這些詞才是誤用。下面幾行比對的是原文，不受 allowed_words 影響：
  # 數字接上天後、封存接上之後的錯字，看起來跟天后、封后一樣，是最常見的混入寫法。
  misused_words:
    - 標准
    - 水准
    - 基准
    - 准備
    - 准確
    - 一天后
    - 二天后
    - 兩天后
    - 三天后
    - 四天后
    - 五天后
    - 六天后
    - 七天后
    - 八天后
    - 九天后
    - 十天后
    - 百天后
    - 千天后
    - 幾天后
    - 數天后
    - 多天后
    - 半天后
    - 今天后
    - 明天后
    - 當天后
    - 隔天后
    - 前天后
    - 昨天后
    - 拆封后
    - 密封后
    - 解封后
    - 查封后

# OpenCC 只用在只報告的用語檢查，不用來判定簡體字（ADR-0102）。
opencc:
  from: tw
  to: twp

# 會進入提示，靜態前綴要位元組一致。維護者在 2026-11-02 逐字審過（ADR-0103）。
style_guide:
  - 用台灣慣用的繁體中文，不用中國大陸用語。
  - 規則文字同詞同譯，敘事與朗讀文字可以放開一點。
  - 數字、骰子與單位都照原文，不換算。
  - 阿拉伯數字一律保留，不改寫成中文數字：1st 譯成第1，3 times 譯成3次。
  - 英文寫成文字的數字照常翻譯：three times 譯成三次。
  - 代名詞依實體卡，沒有實體卡時依上下文判斷。
  - 使用全形標點，引號用「」，引號內的引號用『』。
  - 中文與英文、數字之間不加空格。

# 用語檢查表，只列報告不重送（ADR-0060）。這裡放 OpenCC 片語表以外的自訂清單。
term_checks: []
# 片語表與自訂清單的誤報。
term_exceptions: []

# 代名詞與實體卡不符的檢查只報告（ADR-0123）。這些詞含代名詞集合的字卻不是那個代名詞，先拿掉再比；
# 複數也列進來，卡的代名詞是單數。維護者在 2026-11-09 逐字審過。
pronoun_exceptions:
  - 其他
  - 其它
  - 他人
  - 他們
  - 她們
  - 牠們
  - 它們
  - 祂們
  - 吉他
  - 他鄉
  - 他國
  - 他處
  - 他方
  - 他日
  - 他者
  - 利他
  - 排他
  - 無他
  - 他殺
  - 他用

# 機翻腔訊號，只報告不重送（ADR-0123）。成對的寫法要在同一句裡（中間沒有 sentence_end 的字），
# 前半之後 pair_gap 個字以內出現後半才算。維護者在 2026-11-09 逐字審過；誤報率沒有量過。
translationese:
  pair_gap: 15
  sentence_end: [。, ！, ？]
  phrases:
    - { text: 作為一個, prefer: 身為 }
    - { text: 作為一名, prefer: 身為 }
    - { text: 做出決定, prefer: 決定 }
    - { text: 做出判斷, prefer: 判斷 }
    - { text: 做出回應, prefer: 回應 }
    - { text: 做出反應, prefer: 反應 }
    - { text: 他自己的, prefer: 自己的 }
    - { text: 她自己的, prefer: 自己的 }
    - { text: 它自己的, prefer: 自己的 }
    - { text: 牠自己的, prefer: 自己的 }
    - { text: 其中的一個, prefer: 其中一個 }
    - { text: 毫無疑問地, prefer: 無疑 }
    - { text: 基於此, prefer: 因此 }
    - { text: 就此而言, prefer: 在這方面 }
    - { text: 正在進行中, prefer: 進行中 }
    - { text: 進行了一次, prefer: 直接用動詞 }
    - { text: 對其進行, prefer: 直接用動詞 }
    - { text: 一個非常, prefer: 很 }
    - { text: 被認為是, prefer: 一般認為 }
    - { text: 被允許, prefer: 可以 }
    - { text: 被要求, prefer: 必須 }
    - { text: 擁有一個, prefer: 有一個 }
    - { text: 在這種情況下, prefer: 這時 }
    - { text: 值得注意的是, prefer: 要注意 }
    - { text: 讓我們, prefer: 省略 }
    - { text: 變得更加, prefer: 更 }
    - { text: 在某種程度上, prefer: 多少 }
    - { text: 與此同時, prefer: 同時 }
    - { pair: [被, 所], prefer: 拿掉「所」 }
    - { pair: [由, 所], prefer: 拿掉「由」「所」 }
    - { pair: [當, 的時候], prefer: ……時 }
    - { pair: [對於, 來說], prefer: 對……來說 }
    - { pair: [以, 的方式], prefer: ……地 }
    - { pair: [一種, 的感覺], prefer: 直接寫感覺 }
    - { pair: [最, 之一], prefer: 改寫 }
    - { pair: [對, 進行], prefer: 直接用動詞 }
  exceptions: []
