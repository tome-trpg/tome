schema: tome-lang/1
kind: target
lang: zh-TW
name: 繁體中文（台灣）

# 譯後自動排版的規則，在還原佔位符之前執行，不花 token（ADR-0081）。
punctuation:
  replace:
    ",": "，"
    ";": "；"
    ":": "："
    "?": "？"
    "!": "！"
    "(": "（"
    ")": "）"
    "...": "……"
  quotes:
    open: "「"
    close: "」"
    inner_open: "『"
    inner_close: "』"
  space_around_latin: false

pronouns: [他, 她, 牠, 它, 祂]

# 長度過短算疑似摘要，會重送；過長只報告（白皮書 §5.6）。數字是提案，要等試翻量過。
min_length_ratio: 0.3
max_length_ratio: 1.5

# 混入簡體字的判定，算到就重送，所以誤判的代價是白花費用（ADR-0102）。
# 標準 Big5 收的是繁體用字，大多數簡體字形不在裡面，不用維護完整字表。
# 這份語言資料刻意收錄簡體字，測試工具與核心共用，不留第二份。
script_check:
  encoding: big5
  # 0xC7、0xC8 是保留區，不是標準 Big5。
  lead_ranges: [[164, 198], [201, 249]]
  trail_ranges: [[64, 126], [161, 254]]
  # Big5 也收錄的簡體字形。台、准、划、岩、症 這類在繁體也常用的字不列。
  # 取自 Windows 的繁簡對照，再加上對照表不轉換的幾個字。
  shared_forms: 儿几扑虫听坏厂万与气宁优价异忏机网体吨怀扰岭怜构极泞肮虮复洁种胜苹党茧蚕赶适惊据痒离确腊触蜡篱后于并云叶
  # 這些詞在繁體也這樣寫。
  allowed_words: [皇后, 王后, 太后, 茶几, 云云]
  # 准 本身是繁體用字，這些詞才是誤用。
  misused_words: [標准, 水准, 基准, 准備, 准確]

# OpenCC 只用在只報告的用語檢查，不用來判定簡體字（ADR-0102）。
opencc:
  from: tw
  to: twp

# 這些句子是提案，M2 接進提示前由維護者審過。
style_guide:
  - 用台灣慣用的繁體中文，不用中國大陸用語。
  - 規則文字同詞同譯，敘事與朗讀文字可以放開一點。
  - 數字、骰子與單位都照原文，不換算。
  - 代名詞依實體卡。

# 用語檢查表，只列報告不重送（ADR-0060）。這裡放 OpenCC 片語表以外的自訂清單。
term_checks: []
# 片語表與自訂清單的誤報。
term_exceptions: []
