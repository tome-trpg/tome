# 一律載入的遮蔽模式（白皮書 §5.6、ADR-0100）。數量都設上限，不寫無上限的巢狀重複。
patterns:
  # 1D100、2d6+1、1/1D6、D100、d%、1d4+1d6。
  - id: dice
    use: mask
    kind: dice
    regex: '(?<![\p{L}\p{N}])(?:\d{1,4}/)?\d{0,4}[dD](?:\d{1,4}|%)(?:[+\-−–](?:\d{0,4}[dD])?(?:\d{1,4}|%)){0,4}(?![\p{L}\p{N}])'
  # p.42、pp. 42-45。
  - id: page_ref
    use: mask
    kind: page_ref
    regex: '(?<![\p{L}\p{N}.])[pP]{1,2}\.\s?\d{1,4}(?:\s?[\-–]\s?\d{1,4})?(?![\p{L}\p{N}])'
