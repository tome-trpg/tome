# d100-orc 的數值塊（授權與署名見 NOTICE）。偵測與欄位只涵蓋 Creatures 一章用得到的（ADR-0136）。
# 同名的角色由子包整個取代，所以 style 要自己寫：照抄 generic 那一句，維護者在 2026-11-13 確認（ADR-0136）。
# 欄位是 glossary.yaml 裡數值塊會出現、有譯名的標籤；縮寫保留原文的詞條會遮蔽起來，不列在這裡（ADR-0121）。
# Powers、Weaknesses、Spells 的段落是敘述，不判成數值塊；標籤照樣列著，跟數值塊接在同一個區塊時用得到。
