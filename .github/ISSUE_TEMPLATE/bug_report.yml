name: 回報問題
description: 回報 TOME 的錯誤
body:
  - type: markdown
    attributes:
      value: |
        **不要貼任何商業書籍的文字、譯文或截圖。** 請用自己寫的合成範例重現。
        安全問題請依 SECURITY.md 私下回報，不要開 Issue。
  - type: checkboxes
    id: no-book-content
    attributes:
      label: 確認
      options:
        - label: 這份回報沒有商業書籍的內容，也沒有 API 金鑰或個資
          required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: tome --version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 發生了什麼
      description: 指令、預期結果與實際結果，以及 tome doctor 的輸出
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 用合成範例重現
    validations:
      required: true
