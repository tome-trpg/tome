# TOME 知道怎麼呼叫的模型，不是預設模型（ADR-0041、ADR-0099）。不在表上的模型拒絕執行。
schema: tome-provider/1
id: anthropic

# 讀官方價目頁的日子，滿 60 天會警告。頁面沒有生效日，所以 effective 也填這天（ADR-0103）。
verified: 2026-11-02

# Batch 結果在供應商端保留的天數，估價時顯示（DC-3）。
retention_days: 29

# 全部是提案，沒有量過，M4 的 tome trial 才校準（ADR-0103、H-13）。
estimate:
  chars_per_token: 3
  output_ratio: 1.2
  low: 0.8
  high: 1.3
  retry_margin: 0.1

# 價格是美元／百萬 token。thinking.mode：none 是關不掉，只能降 effort，
# 估價要乘 output_factor；between_tools 與 disabled 是這個模型關閉思考的寫法。
models:
  - id: claude-opus-5-5
    effective: 2026-11-02
    price:
      input: 4
      output: 20
      cache_read: 0.20
      cache_write_5m: 5
      cache_write_1h: 8
      batch_input: 2
      batch_output: 10
    thinking:
      mode: none
      effort: low
      output_factor: 1.5
    fallback:
      server: true
  - id: claude-sonnet-5-5
    effective: 2026-11-02
    price:
      input: 2
      output: 10
      cache_read: 0.10
      cache_write_5m: 2.5
      cache_write_1h: 4
      batch_input: 1
      batch_output: 5
    thinking:
      mode: between_tools
    fallback:
      server: true
  - id: claude-haiku-5-5
    effective: 2026-11-02
    price:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write_5m: 0.125
      cache_write_1h: 0.20
      batch_input: 0.05
      batch_output: 0.25
    # prompt 超過這個長度，整個請求改用這組價格，快取的 token 也算進長度。
    long_prompt:
      over_tokens: 100000
      price:
        input: 0.50
        output: 2.50
        cache_read: 0.05
        cache_write_5m: 0.625
        cache_write_1h: 1
        batch_input: 0.25
        batch_output: 1.25
    thinking:
      mode: disabled
    fallback:
      server: false
  - id: claude-fable-5-1
    effective: 2026-11-02
    price:
      input: 10
      output: 50
      cache_read: 0.25
      cache_write_5m: 12.5
      cache_write_1h: 20
      batch_input: 5
      batch_output: 25
    thinking:
      mode: none
      effort: low
      output_factor: 1.5
    fallback:
      server: true
