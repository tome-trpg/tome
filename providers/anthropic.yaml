# TOME 知道怎麼呼叫的模型，不是預設模型（ADR-0041、ADR-0099）。不在表上的模型拒絕執行。
schema: tome-provider/1
id: anthropic

# 只能連這個端點，其他主機一律擋下（ADR-0039、ADR-0104）。
endpoint: https://api.anthropic.com

# 讀官方價目頁的日子，滿 60 天會警告。頁面沒有生效日，所以 effective 也填這天（ADR-0103）。
verified: 2026-11-02

# Batch 結果在供應商端保留的天數，估價時顯示（DC-3）。
retention_days: 29

# 全部是提案，M4 的試翻才依書校準（ADR-0103、H-13）。標籤、前綴與兩個餘裕依 M3 兩本書的帳本補上
# （ADR-0134），只有 Sonnet 5.5 的數據。
estimate:
  # `user` 與 Pass 0 的提示，每個 token 的字元。
  chars_per_token: 3
  # 翻譯的靜態前綴（TOME 的提示加上全書提要），每個 token 的字元。
  prefix_chars_per_token: 2.4
  # 每個單位的 `<s id>` 標籤，在輸入與輸出另外要的 token。
  unit_input_tokens: 6
  unit_output_tokens: 12
  output_ratio: 1.2
  low: 0.8
  high: 1.3
  # 翻譯的重送，M3 兩本書約是第一次送出的四分之一。
  retry_margin: 0.25
  # Pass 0 的重送很少，實際花費已在估價下限附近，照舊。
  scan_retry_margin: 0.1

# 價格是美元／百萬 token。thinking.mode：none 是關不掉，只能降 effort，
# 估價要乘 output_factor；between_tools 與 disabled 是這個模型關閉思考的寫法。
models:
  - id: claude-opus-5-5
    effective: 2026-11-02
    price:
      input: 4
      output: 20
      cache_read: 0.20
      cache_write_5m: 5
      cache_write_1h: 8
      batch_input: 2
      batch_output: 10
    thinking:
      mode: none
      effort: low
      output_factor: 1.5
    fallback:
      server: true
  - id: claude-sonnet-5-5
    effective: 2026-11-02
    price:
      input: 2
      output: 10
      cache_read: 0.10
      cache_write_5m: 2.5
      cache_write_1h: 4
      batch_input: 1
      batch_output: 5
    thinking:
      mode: between_tools
    fallback:
      server: true
  - id: claude-haiku-5-5
    effective: 2026-11-02
    price:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write_5m: 0.125
      cache_write_1h: 0.20
      batch_input: 0.05
      batch_output: 0.25
    # prompt 超過這個長度，整個請求改用這組價格，快取的 token 也算進長度。
    long_prompt:
      over_tokens: 100000
      price:
        input: 0.50
        output: 2.50
        cache_read: 0.05
        cache_write_5m: 0.625
        cache_write_1h: 1
        batch_input: 0.25
        batch_output: 1.25
    thinking:
      mode: disabled
    fallback:
      server: false
  - id: claude-fable-5-1
    effective: 2026-11-02
    price:
      input: 10
      output: 50
      cache_read: 0.25
      cache_write_5m: 12.5
      cache_write_1h: 20
      batch_input: 5
      batch_output: 25
    thinking:
      mode: none
      effort: low
      output_factor: 1.5
    fallback:
      server: true
  # 2026-11-14 讀官方的模型頁、價目頁與批次頁：批次價列在批次的表裡，快取命中是基本輸入價的 0.025 倍，
  # 沒有長 prompt 的另一組價格。思考一直開著、關不掉，effort 可以調（ADR-0139）。
  # `fallback.server` 照 Fable 5.1 先填，維護者跑 `tome provider test` 對過 Models API 再改。
  - id: claude-fable-5-2
    effective: 2026-11-14
    price:
      input: 8
      output: 40
      cache_read: 0.20
      cache_write_5m: 10
      cache_write_1h: 16
      batch_input: 4
      batch_output: 20
    thinking:
      mode: none
      effort: low
      output_factor: 1.5
    fallback:
      server: true
